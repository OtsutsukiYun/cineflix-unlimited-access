<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="unitv-red-brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4d" />
      <stop offset="45%" stop-color="#f43f5e" />
      <stop offset="85%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#dc2626" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Fundo escuro sutil -->
  <rect width="512" height="512" rx="128" fill="#0a0a0c" stroke="rgba(255,255,255,0.1)" stroke-width="8"/>
  
  <g filter="url(#glow)">
    <!-- Arco Circular Externo do UniTV -->
    <path
      d="M 320 425 C 290 438 255 446 218 446 C 104 446 12 354 12 240 C 12 126 104 34 218 34 C 332 34 424 126 424 240 C 424 278 413 315 393 346"
      stroke="url(#unitv-red-brand)"
      stroke-width="50"
      stroke-linecap="round"
      fill="none"
    />

    <!-- Símbolo Interno Play / 'A' do UniTV -->
    <path
      d="M 195 135 C 195 120 212 110 225 118 L 388 238 C 400 247 400 265 388 274 L 225 394 C 212 402 195 392 195 377 Z"
      fill="url(#unitv-red-brand)"
    />

    <!-- Perna estendida de conexão com o arco -->
    <path
      d="M 270 250 L 400 375"
      stroke="url(#unitv-red-brand)"
      stroke-width="50"
      stroke-linecap="round"
    />
  </g>
</svg>
